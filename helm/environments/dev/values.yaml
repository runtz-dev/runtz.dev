# runtz landing development environment.
#
# No ingress of its own: runtz-dev.runtz.dev (including /home, /legal and
# /install.sh) is routed by the runtz chart's own ingress (see runtz repo,
# helm/environments/dev/values.yaml), which points those paths at the
# runtz-landing Service this chart creates.
#
#   helm upgrade --install runtz-landing ./helm/runtz-landing \
#     -f helm/environments/dev/values.yaml \
#     --set image.tag="dev<sha>"

image:
  repository: registry.local:5000/runtz-landing
  tag: ""
  pullPolicy: Always

env:
  NEXT_PUBLIC_RUNTZ_API_URL: "https://engine-dev.runtz.dev"
