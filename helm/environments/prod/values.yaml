# runtz landing production environment.
#
# runtz.dev (including /home, /legal and /install.sh) is routed by the runtz
# chart's own ingress (see runtz repo, helm/environments/prod/values.yaml),
# which points those paths at the runtz-landing Service this chart creates.
# This chart owns no ingress of its own — see AGENTS.md.
#
#   helm upgrade --install runtz-landing ./helm/runtz-landing \
#     -f helm/environments/prod/values.yaml \
#     --set image.tag="<version>"

image:
  repository: registry.local:5000/runtz-landing
  tag: ""
  pullPolicy: Always

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi

env:
  NEXT_PUBLIC_RUNTZ_API_URL: "https://engine.runtz.dev"
  NEXT_PUBLIC_PLATFORM_BASE_URL: "https://runtz.dev"
  # Traces go to the in-cluster SigNoz collector. ClusterIP only, so this is
  # the FQDN — the short name would not resolve from the prod namespace.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=prod,service.namespace=runtz"
