apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runtz-landing.fullname" . }}
  labels:
    {{- include "runtz-landing.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "runtz-landing.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "runtz-landing.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "runtz-landing.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: landing
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: HOSTNAME
              value: {{ .Values.env.HOSTNAME | quote }}
            - name: NEXT_PUBLIC_BASE_PATH
              value: {{ .Values.env.NEXT_PUBLIC_BASE_PATH | quote }}
            - name: NEXT_PUBLIC_RUNTZ_API_URL
              value: {{ .Values.env.NEXT_PUBLIC_RUNTZ_API_URL | quote }}
            - name: NEXT_PUBLIC_PLATFORM_BASE_URL
              value: {{ .Values.env.NEXT_PUBLIC_PLATFORM_BASE_URL | quote }}
            {{- /*
              OpenTelemetry, only when an endpoint is configured: @vercel/otel
              registers no exporter without OTEL_EXPORTER_OTLP_ENDPOINT, so
              leaving these out entirely is the "telemetry off" state.
            */}}
            {{- range $key := list "OTEL_EXPORTER_OTLP_ENDPOINT" "OTEL_RESOURCE_ATTRIBUTES" }}
            {{- with get $.Values.env $key }}
            - name: {{ $key }}
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
